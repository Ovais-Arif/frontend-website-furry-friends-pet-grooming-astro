name: Unpack project
on:
  push:
    paths: ['project.zip.part*']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: |
          cat project.zip.part* > /tmp/project.zip
          git rm -q --cached project.zip.part*
          rm -f project.zip.part*
          unzip -o /tmp/project.zip -d .
          git config user.name "Ovais Godil"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          git commit -m "Add website source code"
          git push
